name: Publish site

on:
  repository_dispatch:
    types: [publish]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Sync data and photos from Google
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/build_from_google.mjs

      - name: Build static site
        run: npm run build

      - name: Deploy to cPanel over SSH (rsync)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_TARGET_DIR: ${{ secrets.SSH_TARGET_DIR }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # strip stray whitespace / carriage returns that sneak into secrets
          SSH_HOST="$(printf '%s' "$SSH_HOST" | tr -d '\r' | xargs)"
          SSH_PORT="$(printf '%s' "$SSH_PORT" | tr -d '\r' | xargs)"
          SSH_USER="$(printf '%s' "$SSH_USER" | tr -d '\r' | xargs)"
          SSH_TARGET_DIR="$(printf '%s' "$SSH_TARGET_DIR" | tr -d '\r' | xargs)"
          # TEMP DEBUG: reveal host/port past GitHub's secret masking (remove later)
          echo "DEBUG host chars: $(printf '%s' "$SSH_HOST" | sed 's/./& /g')"
          echo "DEBUG host len:   ${#SSH_HOST}"
          echo "DEBUG port chars: $(printf '%s' "$SSH_PORT" | sed 's/./& /g')"
          echo "DEBUG port len:   ${#SSH_PORT}"
          echo "DEBUG user len:   ${#SSH_USER}"
          echo "DEBUG target:     $(printf '%s' "$SSH_TARGET_DIR" | sed 's/./& /g')"
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts || true
          rsync -rlvz --delete \
            --exclude='.well-known' \
            --exclude='.htaccess' \
            --exclude='.ftpquota' \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT" \
            ./dist/ "$SSH_USER@$SSH_HOST:$SSH_TARGET_DIR"
