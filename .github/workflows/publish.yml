name: Publish site

on:
  repository_dispatch:
    types: [publish]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Cache synced photos
        uses: actions/cache@v4
        with:
          path: |
            public/images/trees
            scripts/photo-sync-manifest.json
          key: photo-sync-${{ github.run_id }}
          restore-keys: |
            photo-sync-

      - name: Sync data and photos from Google
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/build_from_google.mjs

      - name: Sync write-ups (Docs) from Google
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/sync_writeups.mjs

      - name: Build static site
        run: npm run build

      - name: Package build
        run: tar -czf site.tar.gz -C dist .

      - name: Publish build to 'live' release (server pulls this)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create the rolling release once; ignore error if it already exists
          gh release create live \
            --title "Latest production build" \
            --notes "Rolling build pulled by the cPanel server. Updated automatically." \
            2>/dev/null || true
          # Replace the asset with the fresh build
          gh release upload live site.tar.gz --clobber
